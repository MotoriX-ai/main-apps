name: motorix_phase2
description: Offline PhysioAI runtime for Motorix patient sessions.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.2+1
  file_picker: ^10.3.3
  flutter_tts: ^4.2.3
  google_mlkit_pose_detection: ^0.14.0
  http: ^1.5.0
  speech_to_text: ^7.4.0
  video_player: ^2.13.0
  web: ^1.1.1
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  wakelock_plus: ^1.3.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.1.1
  test: ^1.25.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/motorix_logo_large.png
    - assets/images/motorix_wordmark.png
    - assets/images/patient_avatar.png
    - assets/images/physiotherapist_avatar.png
    - assets/images/today_progress.png
    - assets/images/celebration_star.png
    - assets/images/celebration_rays.png
    - assets/images/summary_score_halo.png
    - assets/images/summary_sun.png
    - assets/images/summary_score_circle.png
    - assets/images/summary_cloud_left.png
    - assets/images/summary_cloud_right.png
    - assets/images/onboarding_tracking.png
    - assets/images/onboarding_caretaking.png
    - assets/images/onboarding_patient.png
    - assets/images/onboarding_arrow.png
    - assets/images/onboarding_learn_folder.png
    - assets/images/onboarding_learn_video.png
    - assets/images/onboarding_learn_phone.png
    - assets/images/onboarding_learn_hand.png
    - assets/images/onboarding_monitor_person.png
    - assets/images/onboarding_monitor_phone.png
    - assets/images/onboarding_recovery_person.png
    - assets/images/onboarding_recovery_phone.png
    - assets/images/onboarding_recovery_sun.png
    - assets/images/onboarding_recovery_cloud_left.png
    - assets/images/onboarding_recovery_cloud_right.png
    - assets/images/role_patient_illustration.png
    - assets/images/role_patient_camera.png
