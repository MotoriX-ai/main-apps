<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Motorix PhysioAI — aplikasi pasien dan physiotherapist.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#081C2D">
  <title>Motorix PhysioAI</title>
  <script type="module" src="mediapipe/motorix_pose.mjs?v=2"></script>
  <script>
    window.motorixSubscribePush = async function(vapidKey) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        throw new Error('Web push is not supported by this browser.');
      }
      if ((await Notification.requestPermission()) !== 'granted') {
        throw new Error('Notification permission was not granted.');
      }
      const registration = await navigator.serviceWorker.register('/motorix_push_sw.js');
      const padding = '='.repeat((4 - vapidKey.length % 4) % 4);
      const base64 = (vapidKey + padding).replace(/-/g, '+').replace(/_/g, '/');
      const key = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      const existing = await registration.pushManager.getSubscription();
      const subscription = existing || await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: key,
      });
      return JSON.stringify(subscription.toJSON());
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
